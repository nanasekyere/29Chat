# For my reference:
#   docker compose up --build      Build images & start everything
#   docker compose up -d           Start in the background (detached)
#   docker compose down            Stop and remove containers
#   docker compose down -v         Stop and also delete data volumes
#   docker compose logs -f <svc>   Follow logs for one service


services:
  # Auth service database
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-authuser}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-***REDACTED***}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-authuser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  # Message storage service database
  message-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${MESSAGE_DB_USER:-messageuser}
      POSTGRES_PASSWORD: ${MESSAGE_DB_PASSWORD:-***REDACTED***}
      POSTGRES_DB: ${MESSAGE_DB_NAME:-messages}
    volumes:
      - message_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESSAGE_DB_USER:-messageuser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - chat-network

  # Microservices

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-3000}:${API_GATEWAY_PORT:-3000}"
    environment:
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3000}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-3001}
      CHAT_SERVICE_URL: http://chat-service:${CHAT_SERVICE_PORT:-3002}
      MESSAGE_STORAGE_SERVICE_URL: http://message-storage-service:${MESSAGE_STORAGE_SERVICE_PORT:-3003}
      PRESENCE_SERVICE_URL: http://presence-service:${PRESENCE_SERVICE_PORT:-3004}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
    depends_on:
      auth-service:
        condition: service_started
      chat-service:
        condition: service_started
      message-storage-service:
        condition: service_started
      presence-service:
        condition: service_started
    networks:
      - chat-network

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"
    environment:
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      DATABASE_URL: postgresql://${AUTH_DB_USER:-authuser}:${AUTH_DB_PASSWORD:-***REDACTED***}@auth-db:5432/${AUTH_DB_NAME:-auth}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - chat-network

  chat-service:
    build:
      context: .
      args:
        SERVICE_NAME: chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-3002}:${CHAT_SERVICE_PORT:-3002}"
    environment:
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-3002}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  message-storage-service:
    build:
      context: .
      args:
        SERVICE_NAME: message-storage-service
    ports:
      - "${MESSAGE_STORAGE_SERVICE_PORT:-3003}:${MESSAGE_STORAGE_SERVICE_PORT:-3003}"
    environment:
      MESSAGE_STORAGE_SERVICE_PORT: ${MESSAGE_STORAGE_SERVICE_PORT:-3003}
      DATABASE_URL: postgresql://${MESSAGE_DB_USER:-messageuser}:${MESSAGE_DB_PASSWORD:-***REDACTED***}@message-db:5432/${MESSAGE_DB_NAME:-messages}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      message-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  presence-service:
    build:
      context: .
      args:
        SERVICE_NAME: presence-service
    ports:
      - "${PRESENCE_SERVICE_PORT:-3004}:${PRESENCE_SERVICE_PORT:-3004}"
    environment:
      PRESENCE_SERVICE_PORT: ${PRESENCE_SERVICE_PORT:-3004}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network

# Volumes
volumes:
  auth_db_data:
  message_db_data:
  redis_data:
  rabbitmq_data:

# Network
networks:
  chat-network:
    driver: bridge
